<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project Phoenix Launcher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="stage">
    <div class="app">

      <!-- ===================== MAIN ===================== -->
      <section id="view-main" class="view">

        <header class="head rise" style="--d:0s">
          <span class="brand"><span class="brand-dot"></span>PHOENIX</span>
          <div class="head-actions">
          <button class="icon-btn hidden" id="btn-check" data-i18n-title="btn.check">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 12a8 8 0 1 1-2.6-5.9" />
              <polyline points="20 3.5 20 7.5 16 7.5" />
            </svg>
          </button>
          <button class="icon-btn" id="btn-settings" data-i18n-title="head.settingsTip">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <line x1="4" y1="7"  x2="20" y2="7"  />
              <line x1="4" y1="12" x2="20" y2="12" />
              <line x1="4" y1="17" x2="20" y2="17" />
              <circle class="knob" cx="9"  cy="7"  r="2.4" />
              <circle class="knob" cx="15" cy="12" r="2.4" />
              <circle class="knob" cx="8"  cy="17" r="2.4" />
            </svg>
          </button>
          </div>
        </header>

        <div class="status rise" id="status" data-kind="idle" style="--d:.05s">
          <span class="status-dot"></span>
          <div class="status-lines">
            <div class="status-word" id="status-word"></div>
            <div class="status-detail" id="status-detail"></div>
          </div>
        </div>

        <div class="files-head rise" style="--d:.1s">
          <span class="eyebrow" data-i18n="files.title"></span>
          <span class="files-count" id="files-count"></span>
        </div>

        <div class="files-area rise" style="--d:.14s">
          <div class="files-empty" id="files-empty" data-i18n="files.empty"></div>
          <ul class="files" id="files"></ul>
        </div>

        <footer class="actions rise" style="--d:.18s">
          <button class="btn" id="btn-primary"></button>
          <button class="btn ghost hidden" id="btn-customize" data-i18n="link.customize"></button>
          <div class="actions-aux">
            <button class="link neutral hidden" id="btn-whatsnew" data-i18n="link.whatsnew"></button>
            <button class="link hidden" id="btn-uninstall" data-i18n="link.uninstall"></button>
          </div>
        </footer>

        <div class="path rise" id="game-path" title="" style="--d:.22s"></div>
      </section>

      <!-- ===================== SETUP (first run) ===================== -->
      <section id="view-setup" class="view hidden">

        <header class="head">
          <span class="brand"><span class="brand-dot"></span><span data-i18n="head.setup"></span></span>
        </header>

        <div class="setup-hero">
          <div class="setup-title" data-i18n="setup.title"></div>
          <div class="setup-text" data-i18n="setup.text"></div>
        </div>

        <div class="msg" id="setup-msg" hidden></div>

        <div class="setup-spacer"></div>

        <footer class="actions">
          <button class="btn" id="btn-setup-browse" data-i18n="btn.browse"></button>
          <button class="btn ghost" id="btn-setup-autofind" data-i18n="btn.autofind"></button>
        </footer>
      </section>

      <!-- ===================== SETTINGS ===================== -->
      <section id="view-settings" class="view hidden">

        <header class="head">
          <span class="brand"><span class="brand-dot"></span><span data-i18n="head.settings"></span></span>
        </header>

        <div class="fields">
          <div class="field">
            <span class="label" data-i18n="set.language"></span>
            <div class="seg" id="seg-lang">
              <button class="seg-btn" data-value="en">English</button>
              <button class="seg-btn" data-value="ru">Русский</button>
            </div>
          </div>

          <label class="field">
            <span class="label" data-i18n="set.gameFolder"></span>
            <div class="row">
              <input id="in-game" type="text" spellcheck="false" data-i18n-ph="ph.gameAuto" />
              <button class="btn ghost inline" id="btn-browse" data-i18n="btn.browse"></button>
              <button class="btn ghost inline" id="btn-autofind" data-i18n="btn.autofind"></button>
            </div>
            <span class="hint" data-i18n="set.gameHint"></span>
          </label>

          <label class="field">
            <span class="label" data-i18n="set.launch"></span>
            <div class="launch-base"><code>-insecure -console +exec autoexec.cfg</code><span class="hint" data-i18n="set.launchHint"></span></div>
            <input id="in-launch" type="text" spellcheck="false" data-i18n-ph="set.launchPh" />
          </label>

          <div class="field-row">
            <div class="field">
              <span class="label" data-i18n="set.renderer"></span>
              <div class="seg" id="seg-renderer">
                <button class="seg-btn" data-value="dx11">DX11</button>
                <button class="seg-btn" data-value="dx9">DX9</button>
              </div>
            </div>
            <div class="field">
              <span class="label" data-i18n="set.autoexec"></span>
              <button class="btn ghost inline" id="btn-autoexec" data-i18n="set.autoexecBtn"></button>
            </div>
          </div>

          <details class="advanced" id="advanced">
            <summary><span class="label" data-i18n="set.advanced"></span><span class="chev"></span></summary>
            <div class="advanced-body">
              <label class="field">
                <span class="label" data-i18n="set.repo"></span>
                <input id="in-repo" type="text" spellcheck="false" placeholder="Pr0j3ctPh03nix/client-dist" />
                <span class="hint" data-i18n="set.repoHint"></span>
              </label>
              <label class="field">
                <span class="label" data-i18n="set.token"></span>
                <input id="in-token" type="password" spellcheck="false" />
                <span class="hint" data-i18n="set.tokenHint"></span>
              </label>
            </div>
          </details>

          <div class="msg" id="settings-msg" hidden></div>
        </div>

        <footer class="actions">
          <button class="btn" id="btn-save" data-i18n="btn.save"></button>
          <div class="actions-aux">
            <button class="link neutral" id="btn-back" data-i18n="btn.back"></button>
          </div>
        </footer>
      </section>

      <!-- ===================== CUSTOMIZATION ===================== -->
      <section id="view-options" class="view hidden">

        <header class="head">
          <span class="brand"><span class="brand-dot"></span><span data-i18n="head.options"></span></span>
        </header>

        <div class="opt-hint hint" data-i18n="opt.hint"></div>

        <div class="opts-area">
          <div id="opts"></div>
        </div>

        <footer class="actions">
          <button class="btn" id="btn-options-back" data-i18n="btn.back"></button>
        </footer>
      </section>

      <!-- ===================== AUTOEXEC EDITOR ===================== -->
      <section id="view-autoexec" class="view hidden">

        <header class="head">
          <span class="brand"><span class="brand-dot"></span><span data-i18n="head.autoexec"></span></span>
          <span class="dirty hidden" id="ae-dirty"><span class="dirty-dot"></span><span data-i18n="ae.unsaved"></span></span>
        </header>

        <textarea id="ae-text" class="editor" spellcheck="false"></textarea>

        <div class="msg" id="ae-msg" hidden></div>

        <footer class="actions">
          <button class="btn" id="btn-ae-save" data-i18n="btn.save"></button>
          <div class="actions-aux">
            <button class="link neutral" id="btn-ae-close" data-i18n="btn.close"></button>
          </div>
        </footer>
      </section>

      <!-- ===================== WHAT'S NEW ===================== -->
      <section id="view-whatsnew" class="view hidden">

        <header class="head">
          <span class="brand"><span class="brand-dot"></span><span data-i18n="head.whatsnew"></span></span>
        </header>

        <div class="whatsnew-version" id="whatsnew-version"></div>

        <div class="notes-area">
          <div class="notes" id="notes-body"></div>
        </div>

        <footer class="actions">
          <button class="btn" id="btn-whatsnew-back" data-i18n="btn.back"></button>
        </footer>
      </section>

    </div>
  </div>

  <!-- ===================== AUTOFIND MODAL ===================== -->
  <div class="modal hidden" id="af-modal">
    <div class="modal-card">
      <div class="modal-title" data-i18n="af.title"></div>

      <div id="af-warn">
        <p class="modal-text" data-i18n="af.warning"></p>
        <div class="modal-actions">
          <button class="btn" id="btn-af-go" data-i18n="btn.continue"></button>
          <button class="btn ghost" id="btn-af-close" data-i18n="btn.cancel"></button>
        </div>
      </div>

      <div id="af-run" class="hidden">
        <div class="af-progress">
          <span class="spinner"></span>
          <div class="af-lines">
            <div class="af-count" id="af-count"></div>
            <div class="af-current" id="af-current"></div>
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn ghost" id="btn-af-cancel" data-i18n="btn.stop"></button>
        </div>
      </div>

      <div id="af-results" class="hidden">
        <div class="cands-head"><span class="eyebrow" data-i18n="setup.found"></span></div>
        <div class="cands-area">
          <div class="cands-empty hidden" id="cands-empty" data-i18n="setup.none"></div>
          <ul class="cands" id="cands"></ul>
        </div>
        <div class="modal-actions">
          <button class="btn ghost" id="btn-af-done" data-i18n="btn.close"></button>
        </div>
      </div>
    </div>
  </div>

  <div id="loader" class="loader">
    <div class="loader-ring"></div>
    <div class="loader-word">PHOENIX</div>
  </div>

  <script src="i18n.js"></script>
  <script src="main.js"></script>
</body>
</html>
