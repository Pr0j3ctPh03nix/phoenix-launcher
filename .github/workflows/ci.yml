# Build validation for the default branch, on a schedule or on demand — and the only thing that
# populates the Rust build cache the release builds live on.
#
# WHY THIS EXISTS: GitHub Actions caches are REF-SCOPED. A workflow run can restore caches created
# on its own ref or on the default branch, and nothing else — sibling refs, including two
# different tags, cannot see each other's caches. release.yml triggers on tag pushes, so every
# cache it saved was scoped to that one tag and no later release could ever read it. Result: a
# cold, from-scratch dependency build on every single release.
#
# main is the one ref every tag run can read from, so cache writes belong here and release.yml is
# restore-only (`save-if`). The `shared-key` below MUST stay identical to release.yml's — the
# default rust-cache key embeds the job id, which differs across workflows, and mismatched keys
# would silently warm nothing.

name: ci

on:
  # Deliberately NOT on push. A full Tauri build on every commit to main is not worth its minutes,
  # and the cache argument above does not require one: both triggers below also run on the default
  # branch, which is the ref every tag run restores from. The trade accepted is that main gets no
  # automatic build validation — a break lands silently and surfaces at the next run below, or at
  # the next tag.
  #
  # GitHub evicts cache entries untouched for 7 days; releases are usually further apart than
  # that. A weekly build keeps the entry alive and surfaces toolchain drift before a tag needs it.
  schedule:
    - cron: "17 4 * * 1"
  # Also the way to warm the cache on demand — run this before tagging if main has moved a lot.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Not optional here either: src-tauri/build.rs generates trust::PINNED from `.tooling/keys`
      # and REFUSES to build without it, so both cargo steps below depend on this. Pinned to the
      # same SHA release.yml uses — the rationale for fetching rather than vendoring, and for a SHA
      # rather than a branch, is written out there.
      - name: Fetch release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: Pr0j3ctPh03nix/phoenix-release-tooling
          ref: fa40a0b45cc1b6260760494e1ae94dee705f5c36
          path: .tooling

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: tauri-win-release
          cache-on-failure: true

      - name: Install frontend deps
        run: bun install

      # The frontend's own gate: EN/RU key parity and every $("id") main.js reaches for exists.
      # It was written to gate commits — a gate nothing runs is not a gate.
      - name: Frontend consistency (i18n parity + DOM ids)
        run: bun dev/check_i18n.js

      # The engine's unit tests, including the vendored manifest conformance suite
      # (src-tauri/manifest-fixtures/) — the reader's compatibility contract with the dist repo is
      # only a contract if something checks it on every push.
      #
      # --release ON PURPOSE: the cache this workflow shares with release.yml holds
      # release-profile dependency artifacts (the tauri build below compiles the same profile).
      # A plain `cargo test` would cold-compile a second, debug copy of the whole tree and near
      # double the cache for nothing; --release reuses what is already warm.
      - name: Test
        working-directory: src-tauri
        run: cargo test --release

      # Same cargo invocation as the release build, minus NSIS/MSI packaging: the dependency
      # artifacts cached here are exactly the ones release.yml restores. Keep the env identical
      # too, so nothing recompiles on the release side for a differing build input.
      - name: Build (no bundling — cache warm + compile check)
        run: bun run tauri build --no-bundle
        env:
          PHOENIX_CLIENT_DIST_STAGING_REPO_ACCESS: ${{ secrets.PHOENIX_CLIENT_DIST_STAGING_REPO_ACCESS }}
