# Build the launcher on Windows and publish the installers.
#
# Tag push (v*) -> full build + GitHub Release with the NSIS and MSI bundles attached.
# Manual run (workflow_dispatch) -> build only, bundles uploaded as workflow artifacts.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: bun install

      - name: Build (tauri bundle)
        run: bun run tauri build
        env:
          # read-only token for the private staging dist repo, baked into the binary at build
          # time (config.rs). Absent secret -> no token baked, private repos need a user token.
          PHOENIX_BAKED_TOKEN: ${{ secrets.PHOENIX_BAKED_TOKEN }}

      - name: Upload build artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-launcher-bundles
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Publish release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
