# Build validation for the default branch, on a schedule or on demand: the tests, the frontend
# gate, and a full compile of the same code a release builds, with the same pinned inputs.
#
# IT NO LONGER WARMS RELEASE BUILDS, which was its original reason to exist. Actions caches are
# REF-SCOPED — a run may restore caches from its own ref or from the default branch and nothing
# else, so a cache saved under refs/tags/v1.2.0 is invisible to v1.2.1, and main was the one ref
# every tag run could read from. release.yml now restores no cache at all: a cache entry is
# executable input (build scripts, proc-macro DLLs) that the job holding the signing key would run,
# and alone among that job's inputs it cannot be pinned to a revision. The full argument is written
# where that step used to be.
#
# The cache stays HERE, where the trade runs the other way: this job holds no signing key, it lives
# on one ref, and a warm entry is the difference between a check that costs minutes and one that
# costs half an hour. It now serves this workflow's own runs and nothing else.

name: ci

on:
  # Deliberately NOT on push. A full Tauri build on every commit to main is not worth its minutes.
  # The trade accepted is that main gets no automatic build validation — a break lands silently and
  # surfaces at the next run below, or at the next tag.
  #
  # GitHub evicts cache entries untouched for 7 days, and these two triggers are now the only
  # things that touch this one. A weekly build keeps it alive and, more usefully, surfaces drift in
  # what the pinned inputs still resolve to before a tag has to find out.
  schedule:
    - cron: "17 4 * * 1"
  # Also the way to run the check on demand — before tagging, say, if main has moved a lot.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Third-party actions are pinned to COMMIT SHAs, not tags, for the reason release.yml gives:
      # a tag is mutable. It applies here too — this job holds PHOENIX_CLIENT_DIST_STAGING_REPO_ACCESS
      # and writes a cache, and it is the check a release is tagged on the strength of. Every SHA
      # below is the one release.yml already uses for the same action; the trailing comment is the
      # human-readable version, and the two are updated together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # Not optional here either: src-tauri/build.rs generates trust::PINNED from `.tooling/keys`
      # and REFUSES to build without it, so both cargo steps below depend on this. The rationale for
      # fetching rather than vendoring, and for a SHA rather than a branch, is written out in
      # release.yml.
      #
      # THE TWO PINS MOVE TOGETHER, in one commit: this ref decides which `keys/` gets compiled into
      # the binary this workflow checks, and a check built on a different trust root than the
      # release is a check of a different binary.
      - name: Fetch release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: Pr0j3ctPh03nix/phoenix-release-tooling
          ref: 372fbace82ac673335350b59333ef7299469420d
          path: .tooling

      # Pinned to the same version release.yml builds with, and for a second reason on top of that
      # one: a Bun that only CI ever sees would make this workflow's green a statement about a
      # toolchain no release uses. Nothing in the repo declares a version (no `packageManager`, no
      # `.bun-version`), so the pin is written out in both files and moves in one commit.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: "1.4.0"

      # `@stable` was the ref, not an input: at this SHA the action's `toolchain` input defaults to
      # `stable` — a moving compiler, and the one below is what release.yml uses. Keep them equal;
      # a check that passes on a different rustc than the release build is not a check of it. The
      # bump trap (master makes `toolchain` required) is written out in release.yml.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable branch
        with:
          toolchain: "1.98.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
        with:
          workspaces: src-tauri
          # The default key embeds the job id, so a fixed shared-key is what keeps ONE entry across
          # renames of this job rather than orphaning gigabytes per rename. The name is historical —
          # it once had to match release.yml's — and still describes the contents: release-profile
          # artifacts, per the `--release` note below.
          shared-key: tauri-win-release
          cache-on-failure: true

      # --frozen-lockfile here as well as in release.yml, so lockfile drift is a failed check
      # rather than a failed release: `bun install` without it resolves `^2` afresh and rewrites
      # bun.lock in place, which on a runner is a change nobody ever sees.
      - name: Install frontend deps
        run: bun install --frozen-lockfile

      # The frontend's own gate: EN/RU key parity and every $("id") main.js reaches for exists.
      # It was written to gate commits — a gate nothing runs is not a gate.
      - name: Frontend consistency (i18n parity + DOM ids)
        run: bun dev/check_i18n.js

      # The engine's unit tests, including the vendored manifest conformance suite
      # (src-tauri/manifest-fixtures/) — the reader's compatibility contract with the dist repo,
      # checked by the two triggers above and nothing else: weekly, and whenever this workflow is
      # run by hand. Nothing checks it per commit, so a break lands silently and waits for one of
      # those (see the `on:` block) — run it by hand before tagging.
      #
      # --release ON PURPOSE: this workflow's cache holds release-profile dependency artifacts (the
      # tauri build below compiles the same profile). A plain `cargo test` would cold-compile a
      # second, debug copy of the whole tree and near double the cache for nothing; --release
      # reuses what is already warm.
      # --locked: resolve nothing. Cargo.lock is committed, so a dependency that has moved on
      # crates.io must be brought in by a commit that updates it, not by the next run that happens
      # to re-resolve. Here it is also the earliest place lock/manifest drift can surface — the
      # release build passes the same flag, where the same drift would be a failed tag.
      - name: Test
        working-directory: src-tauri
        run: cargo test --release --locked

      # Same cargo invocation as the release build, minus NSIS/MSI packaging and its `--locked`
      # passed through to cargo the same way. Keep the env identical too, so a difference in build
      # inputs can never be the reason the release side behaves differently from this check.
      #
      # PHOENIX_MIRRORS_DIR is deliberately NOT set: release.yml bakes the published mirror list in,
      # and this is the build that proves the other branch of build.rs — no directory, nothing
      # baked, the launcher falls back to GitHub alone — still compiles.
      - name: Build (no bundling — cache warm + compile check)
        run: bun run tauri build --no-bundle -- --locked
        env:
          PHOENIX_CLIENT_DIST_STAGING_REPO_ACCESS: ${{ secrets.PHOENIX_CLIENT_DIST_STAGING_REPO_ACCESS }}
