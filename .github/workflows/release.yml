# Build the launcher on Windows and publish the standalone exe (the launcher is portable —
# it ships inside the game folder, no installer).
#
# Tag push (v*) -> build + GitHub Release with phoenix-launcher.exe attached.
# Manual run (workflow_dispatch) -> build only, exe uploaded as a workflow artifact.
#
# The Rust cache is WRITTEN by ci.yml (on main), not here — see the rust-cache step below.
#
# NEVER interpolate `${{ }}` into a `run:` block. It is textual substitution performed BEFORE the
# shell parses the script, so a tag name is executable code — and this job holds the signing key.
# A git ref is not a safe literal: check-ref-format bars only space, ~ ^ : ? * [ \ and control
# characters, so `$`, backtick, `(`, `)` and `;` are all legal in a tag name. Everything from the
# event goes through `env:` and is read back as `$env:TAG`.
#
# In PowerShell use BRACES — `${env:TAG}` — wherever the next character could continue a variable
# name. A `:` can, so `"refs/tags/$env:TAG:refs/tags/$env:TAG"` parses as the variable `env:TAG:refs`
# (empty) and yields the garbage refspec `refs/tags//tags/v1.2.3` rather than failing.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# re-pushing the same tag (or re-dispatching on the same ref) cancels the stale run instead of
# letting duplicate full builds run to completion
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Third-party actions are pinned to COMMIT SHAs, not tags. A tag is mutable, and this job now
      # holds PHOENIX_SIGNING_KEY as well as the baked token. The trailing comment is the
      # human-readable version; update both together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # The release FORMAT and the tooling that seals it live in one repo, shared by all three
      # payloads (the mod, the launcher, the base game) so that one implementation signs all of
      # them. It used to be vendored into tools/ here; a copy's only possible states are "identical"
      # and "silently stale", and keeping it identical needed a drift check in a third repo.
      #
      # A SHA, never a branch — and it is load-bearing twice over. What sealed a payload has to be
      # an exact revision for a release to stay reproducible, and keys/ below is compiled into the
      # binary, so a moving ref would mean the trust root of a build is whatever HEAD said that day.
      # Bumping it is a deliberate, reviewable commit here.
      #
      # `path:` is not decorative either: src-tauri/build.rs reads the pinned release keys from
      # `.tooling/keys` by default, so this step is a prerequisite of every cargo invocation below,
      # not just of the signing step. It must come AFTER the main checkout, which cleans the
      # workspace it lands in.
      #
      # No `token:`, which is only correct while release-tooling is PUBLIC — the job's default
      # GITHUB_TOKEN is scoped to this repository alone and cannot read a sibling private one.
      - name: Fetch release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: Pr0j3ctPh03nix/phoenix-release-tooling
          ref: 0e3ad70c6f7cf608ccef833107562b1c771394ad
          path: .tooling

      # The version lives in three files and the git tag, and self-update compares the TAG against
      # the binary's CARGO_PKG_VERSION. Ship a tag ahead of Cargo.toml and every client offers an
      # update whose installed build reports the old version — so it offers it again, forever, with
      # the pending-update banner outranking Play. Unrecoverable without cutting another release,
      # so it is checked before anything is built.
      - name: Check version agreement (tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG -replace '^v',''
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          $conf  = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $pkg   = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "tag=$tag Cargo.toml=$cargo tauri.conf.json=$conf package.json=$pkg"
          $bad = @()
          if ($cargo -ne $tag) { $bad += "src-tauri/Cargo.toml ($cargo)" }
          if ($conf  -ne $tag) { $bad += "src-tauri/tauri.conf.json ($conf)" }
          if ($pkg   -ne $tag) { $bad += "package.json ($pkg)" }
          if ($bad.Count) {
            Write-Error "tag $tag does not match: $($bad -join ', ')"
            exit 1
          }

      # The signer's ONE non-stdlib dependency: phoenix_minisign imports Ed25519 from `cryptography`
      # at module scope, so `seal.py` cannot even be imported without it — and the Windows runner
      # image does not ship it. Without this step every run of this workflow, tag or manual, dies at
      # "Sign the launcher payload" with ModuleNotFoundError.
      #
      # Installed HERE rather than beside that step so a broken install costs seconds instead of
      # landing after the multi-minute Tauri build — the same reason the version check above runs
      # this early.
      #
      # NOT `zstandard`: that is the `.phxb` writer's dependency, and only the mod and the base game
      # build bundles. This payload's manifest indexes one loose exe, so nothing on the path
      # gen_launcher_manifest -> build_manifest -> manifest_schema -> seal -> phoenix_minisign
      # imports phxb at all.
      - name: Install the signer's dependency
        run: python -m pip install --disable-pip-version-check cryptography

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
        with:
          workspaces: src-tauri
          # RESTORE-ONLY on tags. Actions caches are ref-scoped: a run may only read caches from
          # its own ref or from the default branch. A cache saved under refs/tags/v1.2.0 is
          # invisible to refs/tags/v1.2.1, so saving here would upload ~GBs that nothing ever
          # reads. ci.yml warms main's cache; every tag run restores from it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # must match ci.yml — the default key includes the job id, which differs per workflow
          shared-key: tauri-win-release
          # a failed build still caches the deps that did compile — a retry resumes instead of
          # starting from zero
          cache-on-failure: true

      - name: Install frontend deps
        run: bun install

      - name: Build (tauri bundle)
        run: bun run tauri build
        env:
          # read-only GitHub access for the PRIVATE client-dist-staging repo, baked into the binary
          # at build time (config.rs). Not a key and not part of trust: it only opens a repo that
          # is not public, and nothing it fetches is believed on its account. Absent secret -> none
          # baked, and private repos then need a user-supplied token.
          PHOENIX_CLIENT_DIST_STAGING_REPO_ACCESS: ${{ secrets.PHOENIX_CLIENT_DIST_STAGING_REPO_ACCESS }}

      # Self-update REQUIRES this sidecar: the launcher refuses to swap itself for a binary it
      # can't verify (selfupdate.rs), because a truncated exe written over a working launcher
      # leaves the user with no launcher at all. A release published without it can still be
      # downloaded by hand — it just can't auto-update. `sha256sum` layout ("<hex>  <name>").
      - name: Checksum the exe
        run: |
          $exe = "src-tauri/target/release/phoenix-launcher.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          # ascii, so no BOM lands in front of the digest (the parser reads the first token)
          "$hash  phoenix-launcher.exe" | Out-File -Encoding ascii "$exe.sha256"
          Get-Content "$exe.sha256"

      - name: Upload build artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: phoenix-launcher
          path: |
            src-tauri/target/release/phoenix-launcher.exe
            src-tauri/target/release/phoenix-launcher.exe.sha256

      # The annotated tag's message IS the changelog, and the RELEASE BODY is where it must land:
      # the launcher renders release notes in its update banner (lu-banner), and self-update reads
      # `release.body` — a body-less release shows the user a version number and nothing else.
      # softprops does not copy tag annotations itself, so extract it here. `contents:body` skips
      # the subject line (redundant with the release title). The re-fetch is required: checkout
      # peels annotated tags to their commit, so the annotation isn't present without it.
      - name: Extract tag message as the release body (tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/${env:TAG}:refs/tags/${env:TAG}"
          git tag -l --format='%(contents:body)' "$env:TAG" | Out-File -Encoding utf8 release_body.md
          Get-Content release_body.md

      # WHY THE LAUNCHER IS SIGNED AT ALL. selfupdate.rs prefers a signed manifest and falls back to
      # the .sha256 sidecar when a release publishes none — and until this step existed, none ever
      # did, so every self-update was decided by a bare hash published by whoever served the
      # release. That is the one payload signing did not cover, and it is the payload that runs.
      #
      # The sidecar is still published, deliberately: already-installed launchers know nothing but
      # the sidecar, and self-update is the one path that has to keep working for builds older than
      # every change made to it. Clients move onto the signed path as they update through this one.
      # NOT tag-gated, on purpose. A manual run seals but publishes nothing, so the signing secret
      # and the fetched tooling can be proven WITHOUT cutting a release — otherwise the first time
      # either is exercised is the one-way cutover itself.
      - name: Sign the launcher payload
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          # Same key as the mod and the game: PINNED in the launcher is ONE ring for every payload,
          # not one key per payload_id, so anything else is refused by every client.
          PHOENIX_SIGNING_KEY: ${{ secrets.PHOENIX_SIGNING_KEY }}
          # Minted per run and scoped to this repository — exactly the access needed to read its own
          # releases for the serial below, and nothing else.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # WHICH number comes next is this producer's business, not the release format's: the format
          # says only that a serial is a u64, and ordering is enforced by the launcher's own
          # per-payload high-water mark. So the rule lives here rather than in shared tooling, and
          # the launcher line is free to number differently from the mod's or the game's.
          #
          # Derived from what is actually PUBLISHED, not counted alongside it. The counter this
          # replaces was 2,000,000 plus the build counter, which RESETS to 1 the day this file is
          # renamed — landing under the ratchet every installed client already holds, where the
          # update simply never appears and nothing reports an error.
          #
          # NO SEED PATH: this line already has releases, so failing to read the last serial is
          # never a reason to start over at 1. Every failure below exits non-zero instead.
          #
          # Computed HERE rather than in `env:` because GitHub's expression language has no
          # arithmetic operators at all: adding inside an expression is a workflow PARSE error that
          # rejects the whole file before any step runs. (Deliberately not spelled with the literal
          # expression syntax even in this comment — see the header: substitution happens before
          # bash sees the script, so an example written out here would itself be evaluated.)
          asset=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
                    --jq '.assets[] | select(.name == "manifest.json") | .url')
          [ -n "$asset" ] || { echo "the latest release carries no manifest.json"; exit 1; }
          prev=$(gh api "$asset" -H "Accept: application/octet-stream" --jq '.serial')
          case "$prev" in ''|*[!0-9]*) echo "published serial is not a number: '$prev'"; exit 1 ;; esac
          serial=$(( prev + 1 ))
          echo "published serial $prev -> this run publishes $serial"
          # No secret check here: seal refuses an unset key by itself, with the reason, and a
          # second copy of that rule is a second place for it to go stale.
          out=src-tauri/target/release
          # release-tooling, fetched at the pinned SHA above — the same scripts, at the same
          # revision, that seal the mod and the base game. The public half comes from the same
          # checkout as the code that verifies against it, so the two can never disagree.
          tools=.tooling/tools
          # The notes come from the annotated tag, so a manual run has none — the field is optional
          # and its absence is the only difference between a dry run and the real thing.
          notes=()
          [ -f release_body.md ] && notes=(--notes-file release_body.md)
          # This repo's own discovery step (dev/): hashes the exe and builds ONE files[] entry
          # through release-tooling's build_manifest.py, which owns every format rule (schema,
          # envelope shape, what a serial may BE). Which serial comes next is decided above, here,
          # because that is a publishing decision rather than a format one. This script only ever
          # knows "hash an exe, name it".
          python dev/gen_launcher_manifest.py \
            --version  "$TAG" \
            --serial   "$serial" \
            --exe      phoenix-launcher.exe \
            --exe-path "$out/phoenix-launcher.exe" \
            "${notes[@]}" \
            --out      "$out/manifest.json" \
            --tools    "$tools"
          # The same seal every other payload goes through — sign, then prove — rather than a
          # second hand-written copy of those two steps in a second repo. The key is read from the
          # environment and never written to disk.
          python "$tools/seal.py" seal \
            --manifest "$out/manifest.json" \
            --pub      .tooling/keys/phoenix-active.pub \
            --trusted-comment "phoenix launcher $TAG"

      # DRAFT first: this action creates the release and then uploads in PARALLEL, so a non-draft
      # release is reachable by clients while its assets are still going up — and a client that sees
      # the manifest before the exe reads it as a release it cannot install.
      - name: Publish release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          # a release missing the sidecar cannot be auto-installed by any client — fail the run
          # rather than publish one, instead of relying on the checksum step having failed first
          fail_on_unmatched_files: true
          draft: true
          body_path: release_body.md
          files: |
            src-tauri/target/release/phoenix-launcher.exe
            src-tauri/target/release/phoenix-launcher.exe.sha256
            src-tauri/target/release/manifest.json
            src-tauri/target/release/manifest.json.minisig

      - name: Undraft the release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false
