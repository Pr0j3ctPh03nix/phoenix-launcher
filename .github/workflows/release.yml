# Build the launcher on Windows and publish the standalone exe (the launcher is portable —
# it ships inside the game folder, no installer).
#
# Tag push (v*) -> build + GitHub Release with phoenix-launcher.exe attached.
# Manual run (workflow_dispatch) -> build only, exe uploaded as a workflow artifact.
#
# The Rust cache is WRITTEN by ci.yml (on main), not here — see the rust-cache step below.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# re-pushing the same tag (or re-dispatching on the same ref) cancels the stale run instead of
# letting duplicate full builds run to completion
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Third-party actions are pinned to COMMIT SHAs, not tags. A tag is mutable, and this job now
      # holds PHOENIX_SIGNING_KEY as well as the baked token. The trailing comment is the
      # human-readable version; update both together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # The version lives in three files and the git tag, and self-update compares the TAG against
      # the binary's CARGO_PKG_VERSION. Ship a tag ahead of Cargo.toml and every client offers an
      # update whose installed build reports the old version — so it offers it again, forever, with
      # the pending-update banner outranking Play. Unrecoverable without cutting another release,
      # so it is checked before anything is built.
      - name: Check version agreement (tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v',''
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          $conf  = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $pkg   = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "tag=$tag Cargo.toml=$cargo tauri.conf.json=$conf package.json=$pkg"
          $bad = @()
          if ($cargo -ne $tag) { $bad += "src-tauri/Cargo.toml ($cargo)" }
          if ($conf  -ne $tag) { $bad += "src-tauri/tauri.conf.json ($conf)" }
          if ($pkg   -ne $tag) { $bad += "package.json ($pkg)" }
          if ($bad.Count) {
            Write-Error "tag $tag does not match: $($bad -join ', ')"
            exit 1
          }

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
        with:
          workspaces: src-tauri
          # RESTORE-ONLY on tags. Actions caches are ref-scoped: a run may only read caches from
          # its own ref or from the default branch. A cache saved under refs/tags/v1.2.0 is
          # invisible to refs/tags/v1.2.1, so saving here would upload ~GBs that nothing ever
          # reads. ci.yml warms main's cache; every tag run restores from it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # must match ci.yml — the default key includes the job id, which differs per workflow
          shared-key: tauri-win-release
          # a failed build still caches the deps that did compile — a retry resumes instead of
          # starting from zero
          cache-on-failure: true

      - name: Install frontend deps
        run: bun install

      - name: Build (tauri bundle)
        run: bun run tauri build
        env:
          # read-only token for the private staging dist repo, baked into the binary at build
          # time (config.rs). Absent secret -> no token baked, private repos need a user token.
          PHOENIX_BAKED_TOKEN: ${{ secrets.PHOENIX_BAKED_TOKEN }}

      # Self-update REQUIRES this sidecar: the launcher refuses to swap itself for a binary it
      # can't verify (selfupdate.rs), because a truncated exe written over a working launcher
      # leaves the user with no launcher at all. A release published without it can still be
      # downloaded by hand — it just can't auto-update. `sha256sum` layout ("<hex>  <name>").
      - name: Checksum the exe
        run: |
          $exe = "src-tauri/target/release/phoenix-launcher.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          # ascii, so no BOM lands in front of the digest (the parser reads the first token)
          "$hash  phoenix-launcher.exe" | Out-File -Encoding ascii "$exe.sha256"
          Get-Content "$exe.sha256"

      - name: Upload build artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: phoenix-launcher
          path: |
            src-tauri/target/release/phoenix-launcher.exe
            src-tauri/target/release/phoenix-launcher.exe.sha256

      # The annotated tag's message IS the changelog, and the RELEASE BODY is where it must land:
      # the launcher renders release notes in its update banner (lu-banner), and self-update reads
      # `release.body` — a body-less release shows the user a version number and nothing else.
      # softprops does not copy tag annotations itself, so extract it here. `contents:body` skips
      # the subject line (redundant with the release title). The re-fetch is required: checkout
      # peels annotated tags to their commit, so the annotation isn't present without it.
      - name: Extract tag message as the release body (tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
          git tag -l --format='%(contents:body)' "${{ github.ref_name }}" | Out-File -Encoding utf8 release_body.md
          Get-Content release_body.md

      # WHY THE LAUNCHER IS SIGNED AT ALL. selfupdate.rs prefers a signed manifest and falls back to
      # the .sha256 sidecar when a release publishes none — and until this step existed, none ever
      # did, so every self-update was decided by a bare hash published by whoever served the
      # release. That is the one payload signing did not cover, and it is the payload that runs.
      #
      # The sidecar is still published, deliberately: already-installed launchers know nothing but
      # the sidecar, and self-update is the one path that has to keep working for builds older than
      # every change made to it. Clients move onto the signed path as they update through this one.
      # NOT tag-gated, on purpose. A manual run seals but publishes nothing, so the signing secret
      # and the vendored tooling can be proven WITHOUT cutting a release — otherwise the first time
      # either is exercised is the one-way cutover itself.
      - name: Sign the launcher payload
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          # Same key as the mod and the game: PINNED in the launcher is ONE ring for every payload,
          # not one key per payload_id, so anything else is refused by every client.
          PHOENIX_SIGNING_KEY: ${{ secrets.PHOENIX_SIGNING_KEY }}
          # 2,000,000 + the build counter — see gen_launcher_manifest.SERIAL_FLOOR. Rises on every
          # run, including a rebuild of the same tag, which a version-derived number cannot do.
          PHOENIX_SERIAL: ${{ 2000000 + github.run_number }}
        run: |
          set -e
          # No secret check here: phx_release refuses an unset key by itself, with the reason, and
          # a second copy of that rule is a second place for it to go stale.
          out=src-tauri/target/release
          # Vendored, not fetched: a release of the READER must not depend on the producer's repo
          # being reachable, on a private repo, or on a token scoped for something else. tools/ is
          # mirrored from the dev superset by its sync.py, whose --check fails if these have
          # drifted from the copies that sign the mod and the game. See tools/README.md.
          tools=tools
          # The notes come from the annotated tag, so a manual run has none — the field is optional
          # and its absence is the only difference between a dry run and the real thing.
          notes=()
          [ -f release_body.md ] && notes=(--notes-file release_body.md)
          python "$tools/gen_launcher_manifest.py" \
            --version  "$TAG" \
            --serial   "$PHOENIX_SERIAL" \
            --exe      phoenix-launcher.exe \
            --exe-path "$out/phoenix-launcher.exe" \
            "${notes[@]}" \
            --out      "$out/manifest.json"
          # The same seal every other payload goes through — validate, sign, prove — rather than a
          # second hand-written copy of those three steps in a second repo. The key is read from
          # the environment and never written to disk.
          python "$tools/phx_release.py" seal \
            --manifest "$out/manifest.json" \
            --pub      "$tools/phoenix-release.pub" \
            --trusted-comment "phoenix launcher $TAG"

      # DRAFT first: this action creates the release and then uploads in PARALLEL, so a non-draft
      # release is reachable by clients while its assets are still going up — and a client that sees
      # the manifest before the exe reads it as a release it cannot install.
      - name: Publish release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          # a release missing the sidecar cannot be auto-installed by any client — fail the run
          # rather than publish one, instead of relying on the checksum step having failed first
          fail_on_unmatched_files: true
          draft: true
          body_path: release_body.md
          files: |
            src-tauri/target/release/phoenix-launcher.exe
            src-tauri/target/release/phoenix-launcher.exe.sha256
            src-tauri/target/release/manifest.json
            src-tauri/target/release/manifest.json.minisig

      - name: Undraft the release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false
