[package]
name = "phoenix-launcher"
version = "1.2.0"
edition = "2021"
description = "Project Phoenix Dota 2 client launcher and updater"
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
rfd = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
directories = "5"
winreg = "0.52"

[profile.release]
opt-level = "s"
# thin LTO + parallel codegen: near-identical exe size, but the final LTO/link step goes from a
# serial re-optimization of every crate to a parallel one — the dominant cost of a release build
# (locally and in CI, where fat LTO defeated most of the rust-cache benefit).
lto = "thin"
codegen-units = 16
strip = true

# Faster dev builds: full debug info (the default) spends serious time writing huge PDBs;
# line tables keep usable backtraces/panic locations.
[profile.dev]
debug = "line-tables-only"
