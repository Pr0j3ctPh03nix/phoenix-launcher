[package]
name = "phoenix-launcher"
version = "1.6.1"
edition = "2021"
description = "Project Phoenix Dota 2 client launcher and updater"
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build.rs `include!`s src/minisig.rs so the build script and the binary cannot disagree about the
# signature format. That file verifies Ed25519, so the script needs the same primitive the binary
# does — the SAME crate, already in the tree; nothing new is pulled in for it.
ring = "0.17"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Storage_FileSystem"] }
rfd = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
# Already in the dependency tree via ureq itself (URL parsing) — declared directly because
# transport.rs's own redirect-target parsing/joining is security-relevant code, not incidental
# reuse of whatever ureq happens to pull in.
url = "2"
sha2 = "0.10"
hex = "0.4"
# Ed25519 for manifest signatures (trust.rs). Already in the tree — ureq -> rustls -> ring — so
# this adds no binary weight; it is declared because a TRANSITIVE dependency is not a dependency.
# A `cargo update` that swapped ureq's TLS provider (aws-lc-rs is the other supported one) would
# silently take our only crypto primitive with it, and the failure would surface as a build error
# in the one module whose whole job is refusing things.
ring = "0.17"
# Bundle decode (manifest schema 3): plain zstd frames, window log ≤ 27 per the spec — the
# reference decoder's default, so no decoder configuration is ever needed. Compression is only
# used by tests (building fixture bundles); the shipped binary decodes.
zstd = "0.13"
anyhow = "1"
directories = "5"
winreg = "0.52"

[profile.release]
opt-level = "s"
# thin LTO + parallel codegen: near-identical exe size, but the final LTO/link step goes from a
# serial re-optimization of every crate to a parallel one — the dominant cost of a release build
# (locally and in CI, where fat LTO defeated most of the rust-cache benefit).
lto = "thin"
codegen-units = 16
strip = true

# Faster dev builds: full debug info (the default) spends serious time writing huge PDBs;
# line tables keep usable backtraces/panic locations.
[profile.dev]
debug = "line-tables-only"
