[package]
name = "phoenix-updater"
version = "0.1.0"
edition = "2021"
description = "Project Phoenix Dota 2 client auto-updater"
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rfd = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
directories = "5"
winreg = "0.52"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
